# Full local stack: API + PostgreSQL + Redis + Seq.
#   docker compose up -d --build        -> API on http://localhost:8080/swagger, logs on http://localhost:8081
#   docker compose up -d postgres redis seq   -> only infrastructure, then `dotnet run --project src/Bonzer.Api`
# PostgreSQL is published on host port 5433 so it does not clash with a locally installed PostgreSQL on 5432.
services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # applies migrations and seeds demo data; use Production + real secrets on servers
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=bonzer_erp;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Serilog__WriteTo__2__Args__serverUrl: "http://seq:5341"
    ports: ["8080:8080"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bonzer_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"   # ingestion (Serilog sink)
      - "8081:80"     # UI

volumes:
  pgdata:
  redisdata:
